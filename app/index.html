<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portal local para practicar técnicas avanzadas de automatización con Playwright y TypeScript."
    />
    <title>Portal avanzado de Playwright</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #16233a;
        background: #eef4f8;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      .page-header { padding: 2rem clamp(1.25rem, 6vw, 5rem); color: #fff; background: linear-gradient(120deg, #153e75, #0f766e); }
      .page-header h1 { margin: 0 0 .5rem; font-size: clamp(2rem, 4vw, 3rem); }
      .page-header p { margin: 0; font-size: 1.1rem; }
      main { width: min(1120px, calc(100% - 2rem)); margin: 2rem auto 4rem; }
      .card { padding: 1.5rem; border: 1px solid #cfdae5; border-radius: 16px; background: #fff; box-shadow: 0 12px 30px rgba(23, 43, 77, .08); }
      .login-card { width: min(480px, 100%); margin: 3rem auto; }
      .stack { display: grid; gap: 1rem; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
      .field { display: grid; gap: .4rem; }
      label { font-weight: 700; }
      input, select { width: 100%; padding: .7rem .8rem; border: 1px solid #9fb0c0; border-radius: 8px; background: #fff; }
      input:focus, select:focus, button:focus-visible { outline: 3px solid #7dd3fc; outline-offset: 2px; }
      .button { border: 0; border-radius: 8px; padding: .75rem 1rem; font-weight: 750; color: #fff; background: #176b64; }
      .button:hover { background: #115e59; }
      .button.secondary { color: #153e75; background: #e1ecf7; }
      .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
      .toolbar h2 { margin: 0; }
      .layout { display: grid; grid-template-columns: minmax(300px, .8fr) minmax(420px, 1.2fr); gap: 1.25rem; align-items: start; }
      .hint { padding: .8rem 1rem; border-left: 4px solid #2b6cb0; background: #edf6ff; }
      .status { min-height: 1.5rem; margin: .75rem 0 0; font-weight: 700; color: #166534; }
      .status.error { color: #b42318; }
      .checkbox { display: flex; align-items: center; gap: .6rem; }
      .checkbox input { width: auto; }
      .search { margin-bottom: 1rem; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: .7rem; border-bottom: 1px solid #d8e2eb; text-align: left; }
      th { color: #fff; background: #244d73; }
      tbody tr:nth-child(even) { background: #f5f8fb; }
      .badge { display: inline-block; padding: .2rem .5rem; border-radius: 999px; font-size: .85rem; font-weight: 700; color: #166534; background: #dcfce7; }
      .badge.inactive { color: #854d0e; background: #fef3c7; }
      code { padding: .1rem .3rem; border-radius: 4px; background: #eef2f6; }

      @media (max-width: 820px) {
        .layout, .grid { grid-template-columns: 1fr; }
        .toolbar { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <header class="page-header">
      <h1>Portal avanzado de Playwright</h1>
      <p>Laboratorio local de selectores, datos, fixtures, evidencias e integración continua.</p>
    </header>
    <main id="app"></main>

    <script>
      const app = document.querySelector('#app');
      const sessionKey = 'curso-avanzado-auth';
      let users = [
        { name: 'Ana QA', email: 'ana.qa@example.test', role: 'QA', active: true },
        { name: 'Luis Dev', email: 'luis.dev@example.test', role: 'Desarrollo', active: false }
      ];

      const escapeHtml = (value) => String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

      function renderLogin() {
        app.innerHTML = `
          <section class="card login-card" aria-labelledby="login-title">
            <h2 id="login-title">Acceso al portal</h2>
            <p class="hint">Credenciales: <code>admin</code> / <code>playwright</code></p>
            <form id="login-form" class="stack">
              <div class="field">
                <label for="username">Usuario</label>
                <input id="username" name="username" autocomplete="username" required />
              </div>
              <div class="field">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required />
              </div>
              <button class="button" type="submit">Iniciar sesión</button>
            </form>
            <p id="login-status" class="status" role="status" aria-live="polite"></p>
          </section>`;

        document.querySelector('#login-form').addEventListener('submit', (event) => {
          event.preventDefault();
          const form = new FormData(event.currentTarget);
          if (form.get('username') === 'admin' && form.get('password') === 'playwright') {
            localStorage.setItem(sessionKey, 'admin');
            renderPortal();
            return;
          }
          const status = document.querySelector('#login-status');
          status.textContent = 'Credenciales incorrectas.';
          status.classList.add('error');
        });
      }

      function renderRows(filter = '') {
        const normalizedFilter = filter.trim().toLowerCase();
        const visibleUsers = users.filter((user) =>
          `${user.name} ${user.email} ${user.role}`.toLowerCase().includes(normalizedFilter)
        );
        const body = document.querySelector('#users-body');
        body.innerHTML = visibleUsers.map((user) => `
          <tr data-testid="user-row">
            <td>${escapeHtml(user.name)}</td>
            <td>${escapeHtml(user.email)}</td>
            <td>${escapeHtml(user.role)}</td>
            <td><span class="badge ${user.active ? '' : 'inactive'}">${user.active ? 'Activo' : 'Inactivo'}</span></td>
          </tr>`).join('');
        document.querySelector('#result-count').textContent = `${visibleUsers.length} resultado${visibleUsers.length === 1 ? '' : 's'}`;
      }

      function renderPortal() {
        app.innerHTML = `
          <div class="toolbar">
            <div>
              <h2>Administración de personas</h2>
              <p>Sesión autenticada como admin.</p>
            </div>
            <button id="logout" class="button secondary" type="button">Cerrar sesión</button>
          </div>
          <div class="layout">
            <section class="card" aria-labelledby="register-title">
              <h2 id="register-title">Registrar persona</h2>
              <form id="registration-form" class="stack">
                <div class="field">
                  <label for="full-name">Nombre completo</label>
                  <input id="full-name" name="fullName" data-testid="full-name" autocomplete="name" required minlength="3" />
                </div>
                <div class="field">
                  <label for="email">Correo electrónico</label>
                  <input id="email" name="email" type="email" autocomplete="email" required />
                </div>
                <div class="field">
                  <label for="role">Perfil</label>
                  <select id="role" name="role" required>
                    <option value="">Selecciona un perfil</option>
                    <option>QA</option>
                    <option>Desarrollo</option>
                    <option>Producto</option>
                  </select>
                </div>
                <label class="checkbox" for="active">
                  <input id="active" name="active" type="checkbox" />
                  Usuario activo
                </label>
                <button class="button" type="submit">Guardar registro</button>
              </form>
              <p id="registration-status" class="status" role="status" aria-live="polite"></p>
            </section>

            <section class="card" aria-labelledby="list-title">
              <h2 id="list-title">Personas registradas</h2>
              <div class="field search">
                <label for="search">Buscar persona</label>
                <input id="search" type="search" placeholder="Nombre, correo o perfil" />
              </div>
              <p id="result-count" aria-live="polite"></p>
              <div class="table-wrap">
                <table id="users-table">
                  <thead><tr><th>Nombre</th><th>Correo</th><th>Perfil</th><th>Estado</th></tr></thead>
                  <tbody id="users-body"></tbody>
                </table>
              </div>
            </section>
          </div>`;

        renderRows();

        document.querySelector('#logout').addEventListener('click', () => {
          localStorage.removeItem(sessionKey);
          renderLogin();
        });

        document.querySelector('#search').addEventListener('input', (event) => renderRows(event.target.value));

        document.querySelector('#registration-form').addEventListener('submit', (event) => {
          event.preventDefault();
          const data = new FormData(event.currentTarget);
          const newUser = {
            name: String(data.get('fullName')).trim(),
            email: String(data.get('email')).trim().toLowerCase(),
            role: String(data.get('role')),
            active: data.get('active') === 'on'
          };
          const status = document.querySelector('#registration-status');

          if (users.some((user) => user.email === newUser.email)) {
            status.textContent = 'Ya existe una persona con ese correo.';
            status.classList.add('error');
            return;
          }

          users = [...users, newUser];
          status.textContent = `Registro guardado: ${newUser.name}.`;
          status.classList.remove('error');
          event.currentTarget.reset();
          document.querySelector('#search').value = '';
          renderRows();
        });
      }

      if (localStorage.getItem(sessionKey) === 'admin') renderPortal();
      else renderLogin();
    </script>
  </body>
</html>
